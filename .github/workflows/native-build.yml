name: Native macOS build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build app and render previews
        run: bash scripts/build.sh
      - name: Test native code and Metal rendering
        run: bash scripts/test.sh
      - name: Package app
        run: bash scripts/package.sh --skip-build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shader-Paper-Patterns-macOS
          path: |
            build/distribution/*
            build/native/Previews/*
          if-no-files-found: warn
